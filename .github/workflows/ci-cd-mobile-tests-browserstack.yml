name: 🌐📱 Mobile Tests - BrowserStack

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Plataforma(s) a ejecutar en BrowserStack
        required: true
        default: both
        type: choice
        options:
          - android
          - ios
          - both
  push:
    branches:
      - '**'
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: browserstack-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

env:
  JAVA_VERSION: '17'
  BROWSERSTACK_HUB_HOST: hub.browserstack.com

jobs:
  sanity-tests:
    name: Sanity Tests (framework health)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      browserstack_auth_ok: ${{ steps.browserstack_auth_sanity.outputs.browserstack_auth_ok }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Grant execute permission to Gradle wrapper
        shell: bash
        run: chmod +x ./gradlew

      - name: 🧪 Run sanity (equivalente local sin mobile)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ci-logs
          ./gradlew --no-daemon clean unitTest test \
            -DENV=local \
            -Drun.mobile.tests=false \
            -Dcucumber.filter.tags="not @mobile" \
            --info 2>&1 | tee build/ci-logs/sanity-gradle.log

      - name: 🔐 BrowserStack auth sanity check
        id: browserstack_auth_sanity
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        shell: bash
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: |
          set -euo pipefail
          mkdir -p build/ci-logs
          echo "browserstack_auth_ok=false" >> "$GITHUB_OUTPUT"

          if [ -z "${BROWSERSTACK_USERNAME:-}" ] || [ -z "${BROWSERSTACK_ACCESS_KEY:-}" ]; then
            echo "Missing BrowserStack credentials" > build/ci-logs/browserstack-auth-check.txt
            exit 1
          fi

          echo "::add-mask::${BROWSERSTACK_USERNAME}"
          echo "::add-mask::${BROWSERSTACK_ACCESS_KEY}"

          http_code=$(curl -sS -u "${BROWSERSTACK_USERNAME}:${BROWSERSTACK_ACCESS_KEY}" -o /dev/null -w "%{http_code}" "https://api-cloud.browserstack.com/app-automate/recent_apps")
          echo "auth_http_code=${http_code}" > build/ci-logs/browserstack-auth-check.txt
          if [ "$http_code" != "200" ]; then
            exit 1
          fi

          echo "browserstack_auth_ok=true" >> "$GITHUB_OUTPUT"

      - name: Upload sanity artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanity-test-results-browserstack
          if-no-files-found: warn
          path: |
            build/ci-logs/
            build/reports/tests/
            build/test-results/
            target/cucumber-reports/
            target/allure-results/
          retention-days: 14

  mobile-tests-browserstack:
    name: "📱 Mobile Tests - BrowserStack (${{ matrix.platform_name }})"
    needs: [ sanity-tests ]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    if: github.event_name == 'workflow_dispatch' && needs.sanity-tests.result == 'success' && needs.sanity-tests.outputs.browserstack_auth_ok == 'true'
    strategy:
      fail-fast: true
      max-parallel: 2
      matrix:
        include:
          - platform: android
            platform_name: Android
          - platform: ios
            platform_name: iOS

    steps:
      - name: ✅ Check platform selection
        id: platform-check
        shell: bash
        run: |
          INPUT="${{ github.event.inputs.platform }}"
          PLATFORM="${{ matrix.platform }}"
          if [[ "$INPUT" == "$PLATFORM" || "$INPUT" == "both" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        if: steps.platform-check.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        if: steps.platform-check.outputs.should_run == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Grant execute permission to Gradle wrapper
        if: steps.platform-check.outputs.should_run == 'true'
        shell: bash
        run: chmod +x ./gradlew

      - name: Prepare BrowserStack runtime variables
        if: steps.platform-check.outputs.should_run == 'true'
        shell: bash
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          BROWSERSTACK_ANDROID_APP_ID: ${{ secrets.BROWSERSTACK_ANDROID_APP_ID }}
          BROWSERSTACK_IOS_APP_ID: ${{ secrets.BROWSERSTACK_IOS_APP_ID }}
          BROWSERSTACK_ANDROID_APP_PACKAGE: ${{ vars.BROWSERSTACK_ANDROID_APP_PACKAGE }}
          BROWSERSTACK_IOS_BUNDLE_ID: ${{ vars.BROWSERSTACK_IOS_BUNDLE_ID }}
          BROWSERSTACK_ANDROID_DEVICE: ${{ vars.BROWSERSTACK_ANDROID_DEVICE }}
          BROWSERSTACK_ANDROID_PLATFORM_VERSION: ${{ vars.BROWSERSTACK_ANDROID_PLATFORM_VERSION }}
          BROWSERSTACK_IOS_DEVICE: ${{ vars.BROWSERSTACK_IOS_DEVICE }}
          BROWSERSTACK_IOS_PLATFORM_VERSION: ${{ vars.BROWSERSTACK_IOS_PLATFORM_VERSION }}
        run: |
          set -euo pipefail
          mkdir -p build/ci-logs

          if [ -z "${BROWSERSTACK_USERNAME:-}" ] || [ -z "${BROWSERSTACK_ACCESS_KEY:-}" ]; then
            echo "ERROR: Missing BrowserStack credentials"
            exit 1
          fi

          SERVER_URL="https://${BROWSERSTACK_USERNAME}:${BROWSERSTACK_ACCESS_KEY}@${BROWSERSTACK_HUB_HOST}/wd/hub"
          echo "::add-mask::${BROWSERSTACK_USERNAME}"
          echo "::add-mask::${BROWSERSTACK_ACCESS_KEY}"
          echo "APPIUM_SERVER_URL=${SERVER_URL}" >> "$GITHUB_ENV"

          if [ "${{ matrix.platform }}" = "android" ]; then
            [ -n "${BROWSERSTACK_ANDROID_APP_ID:-}" ] || { echo "Missing secret BROWSERSTACK_ANDROID_APP_ID"; exit 1; }
            echo "ANDROID_APP=${BROWSERSTACK_ANDROID_APP_ID}" >> "$GITHUB_ENV"
            echo "ANDROID_DEVICE_NAME=${BROWSERSTACK_ANDROID_DEVICE:-Google Pixel 8}" >> "$GITHUB_ENV"
            echo "ANDROID_PLATFORM_VERSION=${BROWSERSTACK_ANDROID_PLATFORM_VERSION:-14}" >> "$GITHUB_ENV"
            if [ -n "${BROWSERSTACK_ANDROID_APP_PACKAGE:-}" ]; then
              echo "ANDROID_APP_PACKAGE=${BROWSERSTACK_ANDROID_APP_PACKAGE}" >> "$GITHUB_ENV"
            fi
          else
            [ -n "${BROWSERSTACK_IOS_APP_ID:-}" ] || { echo "Missing secret BROWSERSTACK_IOS_APP_ID"; exit 1; }
            echo "IOS_APP=${BROWSERSTACK_IOS_APP_ID}" >> "$GITHUB_ENV"
            echo "IOS_DEVICE_NAME=${BROWSERSTACK_IOS_DEVICE:-iPhone 16 Pro}" >> "$GITHUB_ENV"
            echo "IOS_PLATFORM_VERSION=${BROWSERSTACK_IOS_PLATFORM_VERSION:-18}" >> "$GITHUB_ENV"
            if [ -n "${BROWSERSTACK_IOS_BUNDLE_ID:-}" ]; then
              echo "IOS_BUNDLE_ID=${BROWSERSTACK_IOS_BUNDLE_ID}" >> "$GITHUB_ENV"
            fi
          fi

      - name: Preflight BrowserStack app id
        if: steps.platform-check.outputs.should_run == 'true'
        shell: bash
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.platform }}" = "android" ]; then
            APP_ID="${ANDROID_APP:-}"
          else
            APP_ID="${IOS_APP:-}"
          fi
          [ -n "$APP_ID" ] || { echo "Missing APP_ID for ${{ matrix.platform }}"; exit 1; }
          response=$(curl -sS -u "${BROWSERSTACK_USERNAME}:${BROWSERSTACK_ACCESS_KEY}" "https://api-cloud.browserstack.com/app-automate/recent_apps/${APP_ID}.json")
          if echo "$response" | grep -q '"error"'; then
            echo "::error::Invalid app id in BrowserStack: ${APP_ID}"
            echo "$response"
            exit 1
          fi

      - name: Run mobile tests in BrowserStack (como local + ENV browserstack)
        if: steps.platform-check.outputs.should_run == 'true'
        shell: bash
        env:
          ENV: browserstack
        run: |
          set -euo pipefail
          mkdir -p build/ci-logs
          ./gradlew --no-daemon test \
            -DENV=browserstack \
            -Drun.mobile.tests=true \
            -Dplatform.target=${{ matrix.platform }} \
            -Dcucumber.filter.tags="@mobile and @${{ matrix.platform }}" \
            --tests "com.automatizacion.moderna.runner.RunApiDemoTest" \
            --info 2>&1 | tee build/ci-logs/browserstack-gradle-${{ matrix.platform }}.log

      - name: Print Gradle log tail on failure
        if: failure() && steps.platform-check.outputs.should_run == 'true'
        shell: bash
        run: |
          echo "===== LAST 200 LINES OF build/ci-logs/browserstack-gradle-${{ matrix.platform }}.log ====="
          tail -n 200 build/ci-logs/browserstack-gradle-${{ matrix.platform }}.log || true

      - name: Upload BrowserStack test artifacts
        if: always() && steps.platform-check.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-results-browserstack-${{ matrix.platform }}
          if-no-files-found: warn
          path: |
            build/ci-logs/
            build/reports/tests/
            build/test-results/
            target/cucumber-reports/
            target/allure-results/
            target/videos/
            target/screenshots/
          retention-days: 30

  publish-report-browserstack:
    name: 📊 Generate Report - BrowserStack
    needs: [ mobile-tests-browserstack ]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && needs.mobile-tests-browserstack.result == 'success'

    steps:
      - name: Download BrowserStack results
        uses: actions/download-artifact@v4
        with:
          pattern: mobile-test-results-browserstack-*
          merge-multiple: true
          path: downloaded-results

      - name: Install Allure CLI
        shell: bash
        run: |
          set -euo pipefail
          wget -qO allure.tgz https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.tgz
          tar -xzf allure.tgz
          sudo mv allure-2.29.0 /opt/allure
          sudo ln -sf /opt/allure/bin/allure /usr/local/bin/allure
          allure --version

      - name: Generate Allure report
        shell: bash
        run: |
          set -euo pipefail
          RESULTS_DIR=""
          if [ -d "downloaded-results/target/allure-results" ]; then
            RESULTS_DIR="downloaded-results/target/allure-results"
          elif [ -d "downloaded-results/allure-results" ]; then
            RESULTS_DIR="downloaded-results/allure-results"
          fi

          if [ -z "$RESULTS_DIR" ]; then
            echo "No allure results found"
            exit 1
          fi

          allure generate "$RESULTS_DIR" --clean -o allure-report

      - name: Upload Allure HTML report
        uses: actions/upload-artifact@v4
        with:
          name: allure-html-report-browserstack-run-${{ github.run_number }}
          path: allure-report/
          retention-days: 30


