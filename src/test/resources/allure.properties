# ============================================================
# allure.properties ? Propiedades leídas NATIVAMENTE por allure-java
# Referencia oficial: https://allurereport.org/docs/java-configuration/
#
# IMPORTANTE ? qué NO va aquí:
#   ? allure.report.directory  ? argumento de CLI/plugin: allure generate -o <dir>
#   ? allure.report.environment / allure.report.host / allure.report.version ? no existen
#   ? allure.results.clean     ? config del Allure Gradle plugin, no del listener
#   ? environment.properties   ? generado dinámicamente por AllureEnvironmentWriter
#                                 en target/allure-results/ al inicio de cada ejecución
#   ? categories.json          ? copiado al results-dir por AllureEnvironmentWriter
#   ? evidence.*               ? propiedades del framework; viven en config/base.properties
# ============================================================

# Directorio donde el listener escribe los JSON de resultados.
# Sobreescribible con -Dallure.results.directory=<ruta> (p.ej. por entorno o paralelo).
allure.results.directory=target/allure-results

# Nombre que aparece en el header del reporte HTML generado.
# Este valor es el FALLBACK estático (se usa si AllureEnvironmentWriter no se ejecuta).
# En tiempo de ejecución, AllureEnvironmentWriter lo sobreescribe vía System.setProperty:
#   ENV local        ? "Automatización Mobile ? ANDROID [LOCAL]"
#   ENV browserstack ? "Automatización Mobile Cloud ? IOS [BROWSERSTACK]"
allure.report.name=Automatización Mobile ? Appium

# Plantillas de links para @Issue y @TmsLink declarados en los tests.
# {} se reemplaza por el valor de la anotación.
allure.link.issue.pattern=https://jira.tuempresa.com/browse/{}
allure.link.tms.pattern=https://tms.tuempresa.com/tests/{}


