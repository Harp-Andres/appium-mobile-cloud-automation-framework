# ============================================================
# Configuracion base compartida por todos los entornos.
# Cada archivo <env>.properties solo sobrescribe lo que cambie.
# ============================================================

# Selector de plataforma activa: android | ios
# DriverConfigLoader resuelve automaticamente las propiedades
# con el prefijo correspondiente (android.* o ios.*).
platform.target=${PLATFORM_TARGET:android}

# Gestión automática del servidor Appium local.
# true  ? el framework lo levanta si no está corriendo y lo mata al terminar.
# false ? el servidor debe estar corriendo antes de lanzar los tests (CI/BrowserStack).
appium.auto.start=false

# Timeouts compartidos (aplican a ambas plataformas y entornos)
new.command.timeout=120
implicitly.wait=10
explicit.wait=20

# ======================== ANDROID ========================
android.platform.name=Android
android.automation.name=UiAutomator2
android.app.package=io.appium.android.apis
android.app.activity=io.appium.android.apis.ApiDemos

# ======================== IOS ============================
ios.platform.name=iOS
ios.platform.version=17.5
ios.automation.name=XCUITest
ios.bundle.id=
