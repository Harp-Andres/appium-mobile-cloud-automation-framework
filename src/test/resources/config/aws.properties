# AWS Device Farm — specialty of this cloud repo (alongside BrowserStack).
# Device Farm typically packages tests + app and schedules a run via AWS CLI/console.
# This file documents the Appium-facing knobs your custom test environment should mirror.
#
# App artifacts (download first):
#   ./scripts/download-test-apps.sh
#   apps/TheApp.apk                  -> Android
#   apps/SauceLabs-Sample.ipa        -> iOS real devices
#
# Upload examples (AWS CLI):
#   aws devicefarm create-upload --project-arn "$DF_PROJECT_ARN" --name TheApp.apk --type ANDROID_APP
#   # PUT binary to the returned URL, wait for SUCCEEDED, then schedule-run
#
# Appium server URL inside Device Farm custom environments is provided by the farm;
# do not hardcode credentials here.

appium.server.url=${AWS_DEVICE_FARM_APPIUM_URL:http://127.0.0.1:4723}
appium.auto.start=false

android.app.path=apps/TheApp.apk
android.app.package=com.appiumpro.the_app
android.app.activity=.MainActivity

ios.app.path=apps/SauceLabs-Sample.ipa
ios.bundle.id=com.saucelabs.mydemoapp.ios

new.command.timeout=180
