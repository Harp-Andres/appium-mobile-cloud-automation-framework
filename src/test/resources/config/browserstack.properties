# ============================================================
# BrowserStack App Automate
# Upload apps first: ./scripts/download-test-apps.sh
# Prefer env overrides so no secrets / stale bs:// ids are committed.
# ============================================================

appium.server.url=https://hub.browserstack.com/wd/hub

# ======================== ANDROID (TheApp) ========================
# After upload with custom_id=TheApp you can use bs://... OR custom_id in some SDKs.
# Framework expects app capability value (bs://...).
android.app=${BROWSERSTACK_ANDROID_APP:bs://REPLACE_AFTER_UPLOAD_TheApp}
android.device.name=${BROWSERSTACK_ANDROID_DEVICE:Samsung Galaxy S24}
android.platform.version=${BROWSERSTACK_ANDROID_OS:14.0}

# ======================== IOS (Sauce Sample real-device IPA) ========
ios.app=${BROWSERSTACK_IOS_APP:bs://REPLACE_AFTER_UPLOAD_SauceSampleiOS}
ios.device.name=${BROWSERSTACK_IOS_DEVICE:iPhone 15}
ios.platform.version=${BROWSERSTACK_IOS_OS:17}
ios.bundle.id=com.saucelabs.mydemoapp.ios

# BrowserStack project metadata
browserstack.project.name=appium-mobile-cloud-automation-framework
browserstack.build.name=browserstack-build
browserstack.session.name=browserstack-session

browserstack.debug=true
browserstack.networkLogs=true
browserstack.appiumLogs=true
browserstack.video=true
browserstack.deviceLogs=true
browserstack.idleTimeout=300
